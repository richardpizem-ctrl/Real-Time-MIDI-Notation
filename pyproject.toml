# =========================================================
# pyproject.toml — Real-Time MIDI Notation v4.0.0
# Modern, stable build configuration for Python 3.10+
# =========================================================

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-midi-notation"
version = "4.3.1"
description = "Real-time multi-track MIDI notation engine with Yamaha 16-track support, v4 rendering pipeline, UI architecture v4, and real-time processing core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Richard Pizem" }
]

keywords = [
    "midi",
    "real-time",
    "real-time-midi",
    "midi-notation",
    "music-notation",
    "visualization",
    "python",
    "pygame",
    "yamaha",
    "multi-track",
    "music-technology",
    "digital-audio",
    "midi-visualizer",
    "notation-engine",
    "live-notation",
    "timeline-ui",
    "real-time-processing",
    "notation-v4",
    "midi-engine",
    "music-ai"
]

dependencies = [
    "pygame>=2.1.0",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0"
]

[project.urls]
Homepage = "https://github.com/richardpizem-ctrl/Real-Time-MIDI-Notation"
Repository = "https://github.com/richardpizem-ctrl/Real-Time-MIDI-Notation"
Issues = "https://github.com/richardpizem-ctrl/Real-Time-MIDI-Notation/issues"
Documentation = "https://github.com/richardpizem-ctrl/Real-Time-MIDI-Notation/tree/main/docs"
Changelog = "https://github.com/richardpizem-ctrl/Real-Time-MIDI-Notation/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "midi_input*", "notation_engine*", "ui*"]

[tool.setuptools]
py-modules = ["main", "run"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "test_chords.py", "test_no_midi.py"]
